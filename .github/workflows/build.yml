name: APK yig'ish

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: APK yig'ish
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: Faylni nomlash
        run: cp app/build/outputs/apk/debug/app-debug.apk Poligon3D.apk

      - uses: actions/upload-artifact@v4
        with:
          name: Poligon3D
          path: Poligon3D.apk

      - name: Relizga joylash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "v1.${{ github.run_number }}" Poligon3D.apk \
            --title "Poligon 3D v1.${{ github.run_number }}" \
            --notes "Android uchun o'rnatish fayli. Poligon3D.apk ni yuklab oling va telefoningizda oching." \
            --target "${{ github.sha }}"
